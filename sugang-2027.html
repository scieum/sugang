:root[data-theme="dark"]{
  --frame:#1c1d1f; --board:#2a2c2e; --row:#34373a; --row-alt:#2f3d36;
  --ink:#eef3f0; --muted:#a6b3ac; --green:#1f9c5e; --green-ink:#7fd9a8;
  --yellow:#e9dc55; --coral:#e4605c; --teal:#1f8a8d; --orange:#e89c3b; --bar:#7fd9a826; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--frame)}
body{background:var(--frame);color:var(--ink);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

/* title stickers */
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.pill{background:var(--green);color:#fff;font-weight:800;font-size:1rem;padding:8px 26px;border-radius:999px;letter-spacing:.02em}
.sticker{background:#fff;color:#0f6b3d;font-family:var(--f-display);font-weight:900;letter-spacing:-.03em;font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.05;padding:10px 26px 6px;transform:rotate(-2deg);box-shadow:4px 4px 0 #0003}
.sticker.y{background:var(--yellow);color:#0f5a33;font-size:clamp(1.8rem,6.5vw,2.8rem);transform:rotate(1.5deg)}
.meta{color:#d6dbd8;font-size:.86rem}

.board{background:var(--board);border-radius:28px;padding:22px clamp(14px,3vw,28px) 28px;display:flex;flex-direction:column;gap:20px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board);margin:-6px -4px 0;padding:6px 4px 8px}
.tabgroup{display:flex;flex-direction:column;gap:6px;min-width:0}
.tabgroup h2{margin:0;font-size:.82rem;font-weight:700;color:var(--muted);padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabgroup .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tab{font:inherit;font-weight:800;font-size:1rem;border:0;cursor:pointer;padding:12px 8px;min-height:46px;border-radius:14px;
  background:var(--row);color:var(--ink);transition:transform .12s}
.tab:hover{transform:translateY(-1px)}
.tab:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.tab[aria-selected="true"]{color:var(--tab-ink)}
.tab[data-c="green"][aria-selected="true"]{background:var(--green)}
.tab[data-c="coral"][aria-selected="true"]{background:var(--coral)}
.tab[data-c="orange"][aria-selected="true"]{background:var(--orange)}
.tab[data-c="teal"][aria-selected="true"]{background:var(--teal)}

/* panel */
.panel{display:flex;flex-direction:column;gap:14px}
.phead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;color:#fff;padding:14px 20px;border-radius:18px 18px 0 0}
.phead h3{margin:0;font-family:var(--f-display);font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.phead .info{font-size:.88rem;font-weight:600;opacity:.95}
.card{border-radius:18px;overflow:hidden;background:var(--row)}
.controls{display:flex;justify-content:flex-end;gap:6px}
.sort{font:inherit;font-size:.8rem;font-weight:600;border:1px solid var(--muted);background:transparent;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer}
.sort[aria-pressed="true"]{background:var(--ink);color:var(--board);border-color:var(--ink)}
.sort:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

ul.list{list-style:none;margin:0;padding:0;columns:2;column-gap:0}
ul.list li{break-inside:avoid;position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;min-height:48px}
ul.list li:nth-child(odd){background:var(--row-alt)}
ul.list li .bar{position:absolute;inset:0 auto 0 0;background:var(--bar);pointer-events:none}
ul.list .name{position:relative;color:var(--green-ink);font-weight:600;font-size:.98rem;min-width:0;word-break:keep-all}
ul.list .n{position:relative;font-family:var(--f-num);font-weight:700;font-size:1.35rem;letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
ul.list .n small{font-family:var(--f-body);font-style:normal;font-size:.75rem;color:var(--muted);margin-left:2px}
ul.list .tag{font-style:normal;font-weight:700;color:var(--coral);font-size:.86rem}
.note{font-size:.8rem;color:var(--muted);text-align:center;margin:0}
@media (max-width:640px){
  body{padding-block:20px 32px}
  .wrap{gap:20px}
  .hero{gap:8px}
  .pill{font-size:.88rem;padding:6px 20px}

  .sticker.y{font-size:clamp(1.55rem,7.4vw,2rem)}
  .meta{font-size:.8rem;margin:4px 0 0}
  .board{border-radius:22px;padding:12px 10px 18px;gap:12px}
  .tabs{gap:8px;margin:-2px -2px 0;padding:4px 2px 8px}
  .tabgroup{gap:4px}
  .tabgroup h2{font-size:.74rem;padding-left:2px}
  .tabgroup .btns{gap:5px}
  .tab{font-size:.95rem;padding:10px 4px;border-radius:12px}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .sort{font-size:.82rem;padding:8px 10px;min-height:36px}
  .phead{padding:12px 16px;gap:4px 10px}
  .phead h3{font-size:1.2rem}
  .phead .info{font-size:.78rem}
  .card{border-radius:16px}
  ul.list{columns:1}
  ul.list li{padding:10px 16px;min-height:44px;gap:10px}
  ul.list .name{font-size:.94rem;line-height:1.35}
  ul.list .n{font-size:1.18rem}
  ul.list .tag{font-size:.8rem}
  .note{font-size:.74rem;line-height:1.5;padding:0 6px}
}
@media (prefers-reduced-motion:reduce){.tab{transition:none}}

const h=location.hash.slice(1); if(DATA.some(d=>d.id===h)) current=h;

});

  const top=panel.getBoundingClientRect().top, offset=tabs.getBoundingClientRect().bottom+8;
